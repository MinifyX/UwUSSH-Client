<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUSSH app icon: a terminal window with cat ears and a glowing prompt">
  <title>UwUSSH</title>
  <!--
    Made to be told apart at 16–24 px in a taskbar: a dark tile (UwUMail's is
    light pink), and a terminal prompt as big as the tile allows, in the same
    sticker style as Nyu — white die-cut edge, plum outlines, pink body.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43204A"/>
      <stop offset="1" stop-color="#1B1022"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.58" r="0.5">
      <stop offset="0" stop-color="#FF4D8D" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#FF4D8D" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <circle cx="256" cy="300" r="236" fill="url(#glow)"/>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- die-cut edge -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="30">
      <path d="M96 204 L128 70 L236 170 Z"/>
      <path d="M416 204 L384 70 L276 170 Z"/>
      <rect x="52" y="158" width="408" height="300" rx="64"/>
    </g>

    <!-- ears -->
    <g fill="#FF6FA6" stroke="#4B1D3F" stroke-width="14">
      <path d="M96 204 L128 70 L236 170 Z"/>
      <path d="M416 204 L384 70 L276 170 Z"/>
    </g>
    <path d="M124 176 L140 116 L192 166 Z" fill="#FFB8D3"/>
    <path d="M388 176 L372 116 L320 166 Z" fill="#FFB8D3"/>

    <!-- window -->
    <rect x="52" y="158" width="408" height="300" rx="64" fill="#FF6FA6" stroke="#4B1D3F" stroke-width="14"/>
    <g fill="#FFB8D3">
      <circle cx="104" cy="200" r="11"/>
      <circle cx="140" cy="200" r="11"/>
      <circle cx="176" cy="200" r="11"/>
    </g>

    <!-- screen -->
    <rect x="86" y="232" width="340" height="196" rx="38" fill="#2A1531" stroke="#4B1D3F" stroke-width="12"/>

    <!-- the prompt: > and a blinking-cursor bar -->
    <path d="M146 282 L220 330 L146 378" fill="none" stroke="#FFB8D3" stroke-width="34"/>
    <rect x="248" y="352" width="118" height="34" rx="14" fill="#FFD66E"/>

    <!-- blush, so the screen is also a face -->
    <g fill="#FF4D8D" opacity="0.55">
      <ellipse cx="398" cy="296" rx="16" ry="10"/>
    </g>
  </g>

  <!-- sparkle -->
  <path d="M430 40 Q436 76 472 82 Q436 88 430 124 Q424 88 388 82 Q424 76 430 40Z" fill="#FFD66E" stroke="#4B1D3F" stroke-width="8" stroke-linejoin="round"/>
</svg>
