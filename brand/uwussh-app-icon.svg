    <g fill="#FFB8D3"><circle cx="142" cy="175" r="7"/><circle cx="164" cy="175" r="7"/><circle cx="186" cy="175" r="7"/></g>
    <rect x="124" y="194" width="264" height="160" rx="30" fill="#2A1531" stroke="#4B1D3F" stroke-width="11.200000000000001"/>
