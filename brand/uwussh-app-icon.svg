<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUSSH app icon: Nyu as a terminal window with cat ears, on a lavender tile">
  <title>UwUSSH</title>
  <!--
    Built like UwUMail's icon: Nyu slightly tilted on a pastel tile with two
    sparkles and a heart. Lavender instead of pink tells the two apart; the
    dark screen with the UwU face and a >_ prompt says terminal.
  -->
  <defs>
    <linearGradient id="uwu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F1FF"/>
      <stop offset="1" stop-color="#DDD0FF"/>
    </linearGradient>
    <filter id="uwu-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6B3FA0" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#uwu-bg)"/>
  <g transform="translate(256 290) rotate(-8) scale(0.9) translate(-256 -265)">
