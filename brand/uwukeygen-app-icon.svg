<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUKeygen app icon: a golden key whose bow is a cat's head">
  <title>UwUKeygen</title>
  <!--
    UwUSSH's sibling tool: a violet tile, so it sits next to UwUSSH's plum one
    without being mistaken for it, and one big shape — a key whose bow is a
    cat head — that still reads at taskbar size.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C2A6E"/>
      <stop offset="1" stop-color="#1A1433"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFD66E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFD66E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <circle cx="220" cy="210" r="230" fill="url(#glow)"/>

  <g transform="rotate(-38 256 256)" stroke-linejoin="round" stroke-linecap="round">
    <!-- die-cut edge -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="30">
      <path d="M150 150 L168 58 L232 116 Z"/>
      <path d="M362 150 L344 58 L280 116 Z"/>
      <circle cx="256" cy="186" r="118"/>
      <path d="M232 290 H280 V470 H232 Z"/>
      <path d="M270 368 H344 V408 H270 Z"/>
      <path d="M270 426 H322 V462 H270 Z"/>
    </g>

    <!-- shaft and bits -->
    <g fill="#FFD66E" stroke="#4B1D3F" stroke-width="14">
      <path d="M270 368 H344 V408 H270 Z"/>
      <path d="M270 426 H322 V462 H270 Z"/>
      <path d="M232 290 H280 V470 H232 Z"/>
    </g>

    <!-- ears -->
    <g fill="#FFD66E" stroke="#4B1D3F" stroke-width="14">
      <path d="M150 150 L168 58 L232 116 Z"/>
      <path d="M362 150 L344 58 L280 116 Z"/>
    </g>
    <path d="M172 128 L180 92 L208 116 Z" fill="#FFB8D3"/>
    <path d="M340 128 L332 92 L304 116 Z" fill="#FFB8D3"/>

    <!-- bow: the head -->
    <circle cx="256" cy="186" r="118" fill="#FFD66E" stroke="#4B1D3F" stroke-width="14"/>
    <circle cx="256" cy="200" r="70" fill="#FFF3C4"/>

    <!-- face -->
    <g fill="none" stroke="#4B1D3F" stroke-width="12">
      <path d="M204 186 Q218 204 232 186"/>
      <path d="M280 186 Q294 204 308 186"/>
      <path d="M238 220 L247 232 L256 220 L265 232 L274 220"/>
    </g>
    <g fill="#FF6FA6" opacity="0.6">
      <ellipse cx="200" cy="222" rx="14" ry="9"/>
      <ellipse cx="312" cy="222" rx="14" ry="9"/>
    </g>
  </g>

  <path d="M416 360 Q421 392 452 397 Q421 402 416 434 Q411 402 380 397 Q411 392 416 360Z" fill="#FF6FA6" stroke="#4B1D3F" stroke-width="8" stroke-linejoin="round"/>
</svg>
