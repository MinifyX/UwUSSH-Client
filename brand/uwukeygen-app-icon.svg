<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUKeygen app icon: a golden key whose bow is Nyu's head">
  <title>UwUKeygen</title>
  <!--
    The website and GitHub icon, built like UwUMail's: Nyu slightly tilted on
    UwUMail's pastel pink tile (#FFF3F8 to #FFD3E5, the same for every UwU
    app), with sparkles and a heart arranged differently for each app.
    UwUSSH's sibling tool: a key whose bow is Nyu's head, with the UwU face.
    Here: stars top right and top left, the heart bottom left, a tiny star
    bottom right.
  -->
  <defs>
    <linearGradient id="uwu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3F8"/>
      <stop offset="1" stop-color="#FFD3E5"/>
    </linearGradient>
    <filter id="uwu-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C2306F" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#uwu-bg)"/>
