[package]
name = "uwussh-sync"
description = "Offline-first sync client for UwUSSH: outbox, clocks, conflict resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uwussh-proto.workspace = true
uwussh-store.workspace = true
uwussh-vault.workspace = true

parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
x509-cert = "0.3.0"
ed25519-dalek = "3.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
base64.workspace = true
sha2 = "0.11"
webpki-roots = "1.0.9"

# The HTTP half lands with the server: a blocking client on the sync thread,
# with a certificate the pairing pinned.
#   cargo add ureq --features rustls

[dev-dependencies]
serde_json.workspace = true
zeroize.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
