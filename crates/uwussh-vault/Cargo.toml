[package]
name = "uwussh-vault"
description = "Key derivation and record encryption for UwUSSH"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uwussh-proto.workspace = true

argon2.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
# X25519 for the member keys of a team. The version russh already builds.
curve25519-dalek = { version = "5", default-features = false, features = ["zeroize"] }
hkdf = "0.13"
sha2 = "0.11"
