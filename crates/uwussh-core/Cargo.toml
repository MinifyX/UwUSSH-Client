[package]
name = "uwussh-core"
description = "Session engine for UwUSSH: PTY and SSH sessions, SFTP, framing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uwussh-proto.workspace = true
uwussh-keygen.workspace = true

anyhow.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
uuid.workspace = true
russh.workspace = true
russh-sftp.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The same rand russh uses, only to generate throwaway keys for the SSH tests.
rand = "0.10"
# The seed_vault_key example puts a vault key into a store for the end-to-end
# run; it lives here, next to dev_sshd, because both are E2E fixtures and this
# is where a real key is already generated.
uwussh-store.workspace = true
