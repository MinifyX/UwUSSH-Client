[package]
name = "uwussh-assist"
description = "UwUSSH's command assistant: a request in words to one command for the system at hand, with an offline cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
url = "2.5"
# The same HTTP stack as the sync: blocking reqwest on rustls with ring, the
# public roots and the system's.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0.9"

[dev-dependencies]
# Providers in the tests, on 127.0.0.1.
tiny_http = "0.12"
